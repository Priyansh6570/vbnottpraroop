<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0;background:#222}</style></helmet>
<div style="padding:12px;display:flex;gap:12px;align-items:flex-start">
<img id="em" src="../assets/emblem.svg" style="display:block;width:192px;height:192px">
<canvas ref="{{ cv }}" width="192" height="192" style="display:block;background:#444"></canvas>
<textarea ref="{{ ta }}" style="width:300px;height:192px;font:10px monospace"></textarea>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(p){ super(p); this.cv = React.createRef(); this.ta = React.createRef(); }
  componentDidMount(){
    const img = new Image();
    img.onload = () => {
      const c = this.cv.current, ctx = c.getContext('2d');
      ctx.clearRect(0,0,192,192); ctx.drawImage(img,0,0,192,192);
      const url = c.toDataURL('image/png');
      window.__emblem = url; this.ta.current.value = url.length + ' chars';
    };
    img.src = '../assets/emblem.svg';
  }
  renderVals(){ return { cv: this.cv, ta: this.ta }; }
}
</script>
</body>
</html>
